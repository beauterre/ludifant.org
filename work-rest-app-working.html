<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rhythm of Rest – Ludifant.org</title>
<style>

:root {
  /* Alignment Brown Zen Palette */
  --background: #f2ede4;     /* Very light brown / cream */
  --contrast: #5e4d37;       /* Deep alignment brown */
  --accent-primary: #876f4e;  /* Primary Alignment Brown */
  --accent-secondary: #a69c8a; /* Taupe */
  --accent-tertiary: #c2b280;  /* Sandstone */
  --accent-soft: #d3c5b0;      /* Pale Linen */
  
  --button-padding: 16px 32px;
  --button-font: 2rem;
}

/* Page layout */
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--background);
  color: var(--contrast);
  margin: 0;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 25px;
}

/* Headings */
h1, h3 {
  margin: 0;
  text-align: center;
  font-weight: normal;
}
h1 {
  margin-bottom: 15px;
  color: var(--accent-primary);
  font-style: italic;
}
h3 {
  margin-bottom: 25px;
  font-size: 1.1rem;
  opacity: 0.8;
}

small {
  display: block;
  margin-bottom: 15px;
  text-align: center;
  color: #8a8a84;
}

/* Fieldsets - Softened organic panels */
fieldset {
  border: 2px solid var(--accent-primary);
  border-radius: 20px;
  padding: 25px;
  width: 95%;
  max-width: 600px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  margin: 0;
  background: rgba(255,255,255,0.3);
}

fieldset > legend {
  font-weight: normal;
  padding: 0 15px;
  color: var(--accent-primary);
  font-size: 1.5em;
  font-style: italic;
}

fieldset fieldset {
  border: 1px solid var(--accent-secondary);
  border-radius: 15px;
  padding: 15px;
  width: 100%;
  box-sizing: border-box;
  align-self: stretch;
  gap: 10px;
  background: transparent;
}
fieldset fieldset legend {
  font-size: 1.2em;
  color: var(--accent-secondary);
}

/* Timer displays */
#timer, #totaltimer, #state {
  text-align: center;
}
#timer {
  font-size: 4em;
  font-weight: bold;
  color: var(--accent-primary);
}
#totaltimer {
  font-size: 1.8em;
  color: var(--accent-secondary);
}
#state {
  font-size: 1.8em;
  margin-bottom: 10px;
  font-style: italic;
}

/* Progress bars */
#progress-container, #total-progress-container {
  width: 100%;
  height: 12px;
  border-radius: 6px;
  overflow: hidden;
  background: #dcd7cf;
  margin: 10px 0;
}
#progress-bar {
  height: 100%;
  width: 0%;
  background: var(--accent-primary);
  border-radius: 6px;
  transition: width 0.3s;
}
#total-progress-bar {
  height: 100%;
  width: 0%;
  background: var(--accent-secondary);
  border-radius: 6px;
  transition: width 0.3s;
}

button {
  background: var(--accent-secondary);
  color: #fff;
  border: none;
  border-radius: 30px;
  padding: var(--button-padding);
  font-size: var(--button-font);
  font-weight: normal;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(135, 111, 78, 0.3);
  transition: all 0.3s ease;
  width: 100%;
  max-width: 350px;
  margin-top: 10px;
}
button:hover {
  background: var(--accent-primary);
  transform: scale(1.02);
}

input, select {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--accent-soft);
  background: #fff;
  width: 100%;
  box-sizing: border-box;
  font-size: 1.1rem;
  margin: 5px 0;
  color: var(--contrast);
}

@media (max-width: 400px) {
  #timer { font-size: 3.2em; }
  #state { font-size: 1.6em; }
  button { font-size: 1.5rem; padding: 14px 28px; }
}
</style>

<script src="lib/NoSleep.min.js"></script>
<link rel="manifest" href="manifest.json?v=20250920-1630">
<link rel="icon" sizes="192x192" href="img/icon-192.png?v=20250920-1630">
<link rel="icon" sizes="512x512" href="img/icon-512.png?v=20250920-1630">
<meta name="theme-color" content="#876f4e">

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js?v=20250920-1630')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.warn('SW registration failed:', err));
}
</script>
</head>

<body>
<script>const noSleep = new NoSleep();</script>

<small>version 2026-05-13-15:55</small>
<h1>Rhythm of Rest</h1>
<h3 id="date"></h3>

<fieldset style="border-color:var(--accent-primary);color:var(--accent-primary);">
  <legend>Session Timer</legend>
  <div id="debug_last_event" style="display: none;"></div>
  <div id="current_music" style="font-size: 0.9rem; opacity: 0.7; margin-bottom: 5px;">NO MUSIC</div>
  <div id="state">Not in session</div>
  <div id="totaltimer">00:00</div>
  <div id="total-progress-container"><div id="total-progress-bar"></div></div>
  <div id="timer">00:00</div>
  <div id="progress-container"><div id="progress-bar"></div></div>
  <button id="startBtn">Start Session</button>
</fieldset>

<fieldset style="border-color:var(--accent-secondary);color:var(--accent-secondary);">
  <legend><span id="session-controls-minified" style="cursor:pointer;">⚙️</span> Session Controls</legend>
  <div id="settings">
    <label>Total Session (min): <input type="number" id="totalDuration" value="120" min="1"></label><br>
    <label>Work duration (min): <input type="number" id="workDuration" value="10" min="1"></label><br>
    <label>Rest duration (min): <input type="number" id="restDuration" value="5" min="1"></label><br>
    <label>Voice: <select id="voiceSelect"><option value="none">none</option><option value="Alice">Alice</option><option value="Hjalmar">Hjalmar</option></select></label><br><br>

    <fieldset style="border-color:var(--accent-tertiary);color:var(--accent-tertiary);">
      <legend>Work with:</legend>
      <label>Music<input type="checkbox" checked id="workMusic"></label>
      <label>Voice<input type="checkbox" checked id="workVoice"></label>
      <label>minuteBell<input type="checkbox" checked id="workBell"></label>
    </fieldset>

    <fieldset style="border-color:var(--accent-soft);color:var(--accent-soft);">
      <legend>Relax with:</legend>
      <label>Music<input type="checkbox" checked id="relaxMusic"></label>
      <label>Voice<input type="checkbox" checked id="relaxVoice"></label>
      <label>minuteBell<input type="checkbox" checked id="relaxBell"></label>
    </fieldset>
  </div>
</fieldset>

<fieldset style="display: none;">
  <audio id="work-music001" class="music" label="workout" src="audio/music/work/work-music001.mp3"></audio>
  <audio id="work-music002" class="music" label="workout" src="audio/music/work/work-music002.mp3"></audio>
  <audio id="work-music003" class="music" label="workout" src="audio/music/work/work-music003.mp3"></audio>
  <audio id="work-music004" class="music" label="workout" src="audio/music/work/work-music004.mp3"></audio>
  <audio id="work-music001" class="music" label="workout" src="audio/music/work/work-music005.mp3"></audio>
  <audio id="work-music002" class="music" label="workout" src="audio/music/work/work-music006.mp3"></audio>
  <audio id="work-music003" class="music" label="workout" src="audio/music/work/work-music007.mp3"></audio>
  <audio id="work-music004" class="music" label="workout" src="audio/music/work/work-music008.mp3"></audio>
  <audio id="work-music001" class="music" label="workout" src="audio/music/work/work-music009.mp3"></audio>
  <audio id="work-music002" class="music" label="workout" src="audio/music/work/work-music010.mp3"></audio>
  <audio id="work-music003" class="music" label="workout" src="audio/music/work/work-music011.mp3"></audio>
  <audio id="work-music004" class="music" label="workout" src="audio/music/work/work-music012.mp3"></audio>
  <audio id="work-music001" class="music" label="workout" src="audio/music/work/work-music013.mp3"></audio>
  <audio id="work-bell" class="sfx" src="audio/sfx/work-bell.mp3"></audio>
  <audio id="relax-bell" class="sfx" src="audio/sfx/relax-bell.mp3"></audio>
  <audio id="none" class="sfx" src="audio/sfx/none.mp3"></audio>
  <audio id="relax-music001" class="music" src="audio/relax-music/relax-music001.mp3"></audio>
  <audio id="relax-music002" class="music"  src="audio/relax-music/relax-music002.mp3"></audio>
  <audio id="relax-music003" class="music"  src="audio/relax-music/relax-music003.mp3"></audio>
  <audio id="relax-music004" class="music"  src="audio/relax-music/relax-music004.mp3"></audio>
  <audio id="none" class="sfx" src="audio/sfx/none.mp3"></audio>
  <audio id="none" class="music" label="none"  src="audio/music/none.mp3"></audio>
  <audio id="relax-music001" class="music" label="relax" src="audio/relax-music/relax-music001.mp3"></audio>
  <audio id="relax-music002" class="music" label="relax"  src="audio/relax-music/relax-music002.mp3"></audio>
  <audio id="relax-music003" class="music" label="relax"  src="audio/relax-music/relax-music003.mp3"></audio>
  <audio id="relax-music004" class="music" label="relax"  src="audio/relax-music/relax-music004.mp3"></audio>
</fieldset>

<script>
const voiceIds = ['active001','active002','active003','active004','resting001','resting002','resting003','resting004','begin001','begin002','begin003','resume001','resume002','resume003','pause001','pause002','pause003','end001','end002','end003'];
const workMusicIds = ['work-music001','work-music002','work-music003','work-music004'];
const relaxMusicIds = ['relax-music001','relax-music002','relax-music003','relax-music004'];

const startBtn = document.getElementById('startBtn');
const timerEl = document.getElementById('timer'); 
const progressBar = document.getElementById('progress-bar'); 
const totaltimerEl = document.getElementById('totaltimer'); 
const totalProgressBar = document.getElementById('total-progress-bar'); 
const stateEl = document.getElementById('state');
const debugLastEventEl = document.getElementById('debug_last_event');
const currentMusicPlaying = document.getElementById('current_music');
const voiceSelect = document.getElementById('voiceSelect');
const dateEl = document.getElementById('date');
dateEl.innerText = "session: "+new Date().toLocaleString(); 
let currentMusicStopFlag = null;
let voiceAudios = {}; 

let TotalMins = 120, workMins = 10, restMins = 5;
let currentState = "idle", phaseElapsed = 0, totalElapsed = 0, phaseDuration = 0, lastEvent = "";
let sessionStarted, phaseStarted;

const EventType = { VOICE: "voice", MUSIC: "music", BELL: "bell", CHEER: "cheer" };

function shuffle(array){ return array.sort(()=>Math.random()-0.5); }
function setMusicVolume(ids, volume){
    ids.forEach(id => {
        const audio = document.getElementById(id);
        if(audio) audio.volume = volume;
         if(volume === 0) { audio.pause(); audio.currentTime = 0; }
    });
}

async function playPlaylist(ids, stopFlag){
    while(!stopFlag.stop){
        const list = shuffle(ids.slice());
        for(const id of list){
            if(stopFlag.stop) return;
            const audio = document.getElementById(id);
            if(!audio) continue;
            audio.currentTime = 0;
            currentMusicPlaying.innerText = "Music: " + audio.src.split('/').pop();
            await audio.play();
            await new Promise(resolve => { audio.onended = resolve; });
            await new Promise(resolve => setTimeout(resolve,2000));
        }
    }
}

function formatTime(seconds){
    return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
}

async function loadVoiceAudios(selectedVoice) {
    voiceAudios = {};
    const loadPromises = [];
    const voiceEvents = ['begin','resume','pause','end'];
    const cheers = ['active','resting'];

    [...voiceEvents, ...cheers].forEach(prefix => {
        voiceAudios[prefix] = [];
        for (let i = 1; i <= 4; i++) {
            const path = `audio/voices/${selectedVoice}/${prefix}00${i}.mp3`;
            const audio = new Audio(path);
            voiceAudios[prefix].push(audio);
            loadPromises.push(new Promise(res => { 
                audio.addEventListener('canplaythrough', res, {once: true}); 
                audio.addEventListener('error', res, {once: true}); 
            }));
        }
    });
    await Promise.all(loadPromises);
}

function buildPhaseEvents(phase, isFirstPhase) {
    const events = [];
    const phaseSec = phase === "work" ? workMins*60 : restMins*60;
    let voiceDesc = (isFirstPhase && phase === "work") ? "begin voice" : (phase === "work" ? "resume voice" : "pause voice");
    
    events.push({ type: EventType.VOICE, time: 2, phase, description: voiceDesc });
    events.push({ type: EventType.MUSIC, time: 1, phase, description: `${phase} music start` });
    events.push({ type: EventType.BELL, time: 0, phase, description: "minute bell" });

    for(let t = 60; t <= phaseSec; t += 60){
        if(t < (phaseSec-10)){
            events.push({ type: EventType.BELL, time: t, phase, description: "minute bell" });
            events.push({ type: EventType.CHEER, time: t+2, phase, description: phase==="work" ? "active cheer" : "resting cheer" });
        }
    }
    return events;
}

function buildSessionEventList() {
    const allEvents = [];
    let totalTime = 0;
    let isFirstPhase = true;
    let lastPhase = "work";

    while(totalTime < TotalMins*60){
        for(const phase of ["work", "rest"]){
            lastPhase = phase;
            const phaseEvents = buildPhaseEvents(phase, isFirstPhase);
            phaseEvents.forEach(e => e.time += totalTime);
            allEvents.push(...phaseEvents);
            totalTime += phase === "work" ? workMins*60 : restMins*60;
            isFirstPhase = false;
            if(totalTime >= TotalMins*60) break;
        }
    }
    allEvents.push({ type: EventType.VOICE, time: TotalMins*60, phase: lastPhase, description: "end voice" });
    return allEvents.sort((a,b) => a.time - b.time);
}

startBtn.addEventListener('click', async () => {
    noSleep.enable();
    workMins = parseInt(document.getElementById('workDuration').value,10);
    restMins = parseInt(document.getElementById('restDuration').value,10);
    TotalMins = parseInt(document.getElementById('totalDuration').value,10);
    await loadVoiceAudios(voiceSelect.value);
    
    sessionEventList = buildSessionEventList();
    firedEvents.clear();
    currentState = "work";
    phaseElapsed = 0;
    totalElapsed = 0;
    sessionStarted = Date.now();
    phaseStarted = Date.now();
    phaseDuration = workMins * 60;
    stateEl.innerText = "Active";
    progressBar.style.width = '0%';
    totalProgressBar.style.width = '0%';
    requestAnimationFrame(animate);
});

let firedEvents = new Set();
function fireEvent(event) {
    switch(event.type) {
        case EventType.VOICE:
            let prefix = event.description.split(' ')[0]; 
            const vAuds = voiceAudios[prefix];
            if(vAuds) vAuds[Math.floor(Math.random()*vAuds.length)].play();
            break;
        case EventType.CHEER:
            const cPrefix = (event.phase === "work") ? 'active' : 'resting';
            const cAuds = voiceAudios[cPrefix];
            if(cAuds) cAuds[Math.floor(Math.random()*cAuds.length)].play();
            break;
        case EventType.MUSIC:
            let mIds = event.phase === "work" ? workMusicIds : relaxMusicIds;
            let mEnabled = document.getElementById(event.phase + 'Music').checked;
            if(mEnabled) {
                if(currentMusicStopFlag) currentMusicStopFlag.stop = true;
                setMusicVolume(mIds, 0.5);
                currentMusicStopFlag = { stop: false };
                playPlaylist(mIds, currentMusicStopFlag);
            }
            break;
        case EventType.BELL:
            const bId = event.phase === "work" ? "work-bell" : "relax-bell";
            const bAudio = document.getElementById(bId);
            if(bAudio) { bAudio.currentTime = 0; bAudio.play(); }
            break;
    }
}

window.addEventListener('DOMContentLoaded', () => {
    const settingsDiv = document.getElementById('settings');
    const toggleIcon = document.getElementById('session-controls-minified');
    settingsDiv.style.display = 'none';
    toggleIcon.addEventListener('click', () => {
        const isHidden = settingsDiv.style.display === 'none';
        settingsDiv.style.display = isHidden ? 'block' : 'none';
        toggleIcon.textContent = isHidden ? '❌' : '⚙️';
    });
});

function animate(){
    const tElapsed = Math.floor((Date.now() - sessionStarted) / 1000);
    const pElapsed = Math.floor((Date.now() - phaseStarted) / 1000);
    const remainingPhase = Math.max(phaseDuration - pElapsed, 0);
    
    timerEl.innerText = "phase: "+formatTime(remainingPhase);
    progressBar.style.width = `${100 * (phaseDuration - remainingPhase) / phaseDuration}%`;
    const remainingTotal = Math.max(TotalMins * 60 - tElapsed, 0);
    totaltimerEl.innerText = "session: "+formatTime(remainingTotal);
    totalProgressBar.style.width = `${100 * (TotalMins*60 - remainingTotal) / (TotalMins*60)}%`;

    sessionEventList.forEach(event => {
        if(tElapsed >= event.time && !firedEvents.has(event)){
            firedEvents.add(event);
            fireEvent(event);
        }
    });

    if(pElapsed >= phaseDuration){
        if(tElapsed >= TotalMins*60){
            currentState = "done";
            stateEl.innerText = "Done";
            return;
        }
        currentState = (currentState === "work") ? "rest" : "work";
        phaseDuration = (currentState === "work") ? workMins*60 : restMins*60;
        stateEl.innerText = (currentState === "work") ? "Active" : "Resting";
        phaseStarted = Date.now();
    }

    if(remainingPhase <= 10) {
        setMusicVolume(workMusicIds.concat(relaxMusicIds), 0.5 * (remainingPhase / 10));
    }

    if(currentState !== "done") requestAnimationFrame(animate);
}
</script>
</body>
</html>
