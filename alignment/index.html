<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work/Rest Session Timer</title>
<style>

:root {
  --background: #f0f0f0;
  --contrast: #222;
  --accent1: #ff7f50;
  --accent2: #6a5acd;
  --accent3: #20b2aa;
  --accent4: #ff69b4;
  --button-padding: 16px 32px;
  --button-font: 2.7rem;
}

/* Page layout */
body {
  font-family: 'Segoe UI', sans-serif;
  background: var(--background);
  color: var(--contrast);
  margin: 0;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 25px; /* vertical spacing between main elements */
}

/* Headings */
h1, h3 {
  margin: 0;
  text-align: center;
}
h1 {
  margin-bottom: 15px;
}
h3 {
  margin-bottom: 25px;
}

/* Small version text */
small {
  display: block;
  margin-bottom: 15px;
  text-align: center;
  color: #555;
}

/* Fieldsets */
fieldset {
  border: 5px solid var(--accent1);
  border-radius: 15px;
  padding: 25px;
  width: 95%;
  max-width: 600px;
  box-sizing: border-box;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px; /* vertical spacing between children */
  margin: 0; /* spacing handled by body gap */
}

/* Legends */
fieldset > legend {
  font-weight: bold;
  padding: 0 10px;
  color: inherit;
  font-size: 2.5em;
}

/* Nested fieldsets */
fieldset fieldset {
  border-radius: 10px;
  padding: 15px;
  width: 100%;
  box-sizing: border-box;
  align-self: stretch;
  gap: 10px;
}
fieldset fieldset legend {
  font-size: 2em;
}

/* Timer displays */
#timer, #totaltimer, #state {
  text-align: center;
}
#timer {
  font-size: 4em;
  font-weight: bold;
}
#totaltimer {
  font-size: 2em;
}
#state {
  font-size: 2em;
  margin-bottom: 10px;
}

/* Progress bars */
#progress-container, #total-progress-container {
  width: 100%;
  height: 25px;
  border-radius: 12px;
  overflow: hidden;
  background: #ccc;
  margin: 10px 0; /* vertical spacing */
}
#progress-bar {
  height: 100%;
  width: 0%;
  background: var(--accent3);
  border-radius: 12px;
  transition: width 0.3s;
}
#total-progress-bar {
  height: 100%;
  width: 0%;
  background: var(--accent2);
  border-radius: 12px;
  transition: width 0.3s;
}

/* Buttons */
button {
  background: var(--accent4);
  color: #fff;
  border: none;
  border-radius: 15px;
  padding: var(--button-padding);
  font-size: var(--button-font);
  font-weight: bold;
  cursor: pointer;
  box-shadow: 5px 5px 12px rgba(0,0,0,0.2), -5px -5px 12px rgba(255,255,255,0.2);
  transition: all 0.2s;
  width: 100%;
  max-width: 350px;
  margin-top: 10px; /* spacing above button */
}
button:hover {
  box-shadow: inset 4px 4px 10px rgba(0,0,0,0.2), inset -4px -4px 10px rgba(255,255,255,0.2);
}

/* Inputs & selects */
input, select {
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  width: 100%;
  box-sizing: border-box;
  font-size: 1.2rem;
  margin: 5px 0; /* vertical spacing */
}

/* Small screens */
@media (max-width: 400px) {
  #timer { font-size: 3.5em; }
  #state { font-size: 1.8em; }
  button { font-size: 1.3rem; padding: 14px 28px; }
  #progress-container, #total-progress-container { height: 22px; }
}


</style>



<!-- NoSleep -->
<script src="lib/NoSleep.min.js"></script>

<!-- PWA manifest + icons (with versioning) -->
<link rel="manifest" href="manifest.json?v=20250920-1630">
<link rel="icon" sizes="192x192" href="img/icon-192.png?v=20250920-1630">
<link rel="icon" sizes="512x512" href="img/icon-512.png?v=20250920-1630">
<meta name="theme-color" content="#6a5acd">

<!-- Service Worker -->
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js?v=20250920-1630')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.warn('SW registration failed:', err));
}
</script>
</head>

<body>
<script>
const noSleep = new NoSleep();

</script>

<small>version 2025-09-20-18:09</small>
<h1>Work/Rest Session Timer</h1>
<h3 id="date"></h3>


<fieldset style="border-color:var(--accent4);color:var(--accent4);">
  <legend>Session Timer</legend>
  <div id="debug_last_event" style="display: none;">NO EVENTS <!-- remove style if you want to track events on page for debugging.. --></div>
  <div id="current_music">NO MUSIC</div>
  <div id="state">Not in session</div>
  
  <!-- Total session timer -->
  <div id="totaltimer">00:00</div>
  <div id="total-progress-container" style="width:100%;height:15px;background:#ccc;border-radius:8px;margin:5px 0;">
    <div id="total-progress-bar" style="width:0%;height:100%;background:#6a5acd;border-radius:8px;"></div>
  </div>

  <!-- Current phase timer -->
  <div id="timer">00:00</div>
  <div id="progress-container" style="width:100%;height:15px;background:#ccc;border-radius:8px;margin:5px 0;">
    <div id="progress-bar" style="width:0%;height:100%;background:#20b2aa;border-radius:8px;"></div>
  </div>

  <button id="startBtn">Start Session</button>
</fieldset>

<fieldset style="border-color:var(--accent1);color:var(--accent1);">
  <legend>
    <span id="session-controls-minified" style="cursor:pointer;">⚙️</span>
    Session Controls
  </legend>
  <div id="settings">
    <!-- Your existing session controls content here -->
    <label>Total Session (min): <input type="number" id="totalDuration" value="120" min="1"></label><br>
    <label>Work duration (min): <input type="number" id="workDuration" value="10" min="1"></label><br>
    <label>Rest duration (min): <input type="number" id="restDuration" value="5" min="1"></label><br>
    <label>Voice: 
      <select id="voiceSelect">
        <option value="Alice">Alice</option>
        <option value="Bob">Bob</option>
      </select>
    </label><br><br>

    <fieldset style="border-color:var(--accent2);color:var(--accent2);">
      <legend>Work with:</legend>
      <label>Music<input type="checkbox" checked id="workMusic"></label>
      <label>Voice<input type="checkbox" checked id="workVoice"></label>
      <label>minuteBell<input type="checkbox" checked id="workBell"></label>
    </fieldset>

    <fieldset style="border-color:var(--accent3);color:var(--accent3);">
      <legend>Relax with:</legend>
      <label>Music<input type="checkbox" checked id="relaxMusic"></label>
      <label>Voice<input type="checkbox" checked id="relaxVoice"></label>
      <label>minuteBell<input type="checkbox" checked id="relaxBell"></label>
    </fieldset>

  </div>
</fieldset>

<fieldset style="display: none;">
<!-- remove style if you want to track audio on page for debugging.. -->

  <legend  style="display: none;">Audio Debug</legend>
  <!-- Work music -->
  <audio id="work-music001" src="audio/work-music001.mp3" controls></audio>
  <audio id="work-music002" src="audio/work-music002.mp3" controls></audio>
  <audio id="work-music003" src="audio/work-music003.mp3" controls></audio>
  <audio id="work-music004" src="audio/work-music004.mp3" controls></audio>

    <!-- Minute Bells -->
  <audio id="work-bell" src="audio/work-bell.mp3" controls></audio>
  <audio id="relax-bell" src="audio/relax-bell.mp3" controls></audio>

  <!-- Relax music -->
  <audio id="relax-music001" src="audio/relax-music001.mp3" controls></audio>
  <audio id="relax-music002" src="audio/relax-music002.mp3" controls></audio>
  <audio id="relax-music003" src="audio/relax-music003.mp3" controls></audio>
  <audio id="relax-music004" src="audio/relax-music004.mp3" controls></audio>

  <!-- Event Voices -->
  <audio id="begin001" src="audio/Alice/begin001.mp3" controls></audio>
  <audio id="begin002" src="audio/Alice/begin002.mp3" controls></audio>
  <audio id="begin003" src="audio/Alice/begin003.mp3" controls></audio>
  <audio id="end001" src="audio/Alice/end001.mp3" controls></audio>
  <audio id="end002" src="audio/Alice/end002.mp3" controls></audio>
  <audio id="end003" src="audio/Alice/end003.mp3" controls></audio>
  
  <!-- Cheer Voices -->
  <audio id="active001" src="audio/Alice/active001.mp3" controls></audio>
  <audio id="active002" src="audio/Alice/active002.mp3" controls></audio>
  <audio id="active003" src="audio/Alice/active003.mp3" controls></audio>
  <audio id="active004" src="audio/Alice/active004.mp3" controls></audio>
  <audio id="resting001" src="audio/Alice/resting001.mp3" controls></audio>
  <audio id="resting002" src="audio/Alice/resting002.mp3" controls></audio>
  <audio id="resting003" src="audio/Alice/resting003.mp3" controls></audio>
  <audio id="resting004" src="audio/Alice/resting004.mp3" controls></audio>


</fieldset>

<script author="hjalmar">
// Assets

// Audio arrays
const voiceIds = [// cheers
					'active001','active002','active003','active004',
					'resting001','resting002','resting003','resting004',
				  // events
				  'begin001','begin002','begin003',
				  'resume001','resume002','resume003',
				  'pause001','pause002','pause003',
				  'end001','end002','end003'
				 ];
const workMusicIds = ['work-music001','work-music002','work-music003','work-music004','work-music005','work-music006','work-music007','work-music008','work-music009','work-music010','work-music011','work-music012','work-music013'];
const relaxMusicIds = ['relax-music001','relax-music002','relax-music003','relax-music004'];
</script>
<script author="hjalmar && AI">

//DOM elements
const startBtn = document.getElementById('startBtn');
const timerEl = document.getElementById('timer'); // phase timer
const progressBar = document.getElementById('progress-bar'); // phase progress
const totaltimerEl = document.getElementById('totaltimer'); // total session timer
const totalProgressBar = document.getElementById('total-progress-bar'); // total progress
const stateEl = document.getElementById('state');
const debugLastEventEl = document.getElementById('debug_last_event');
const currentMusicPlaying = document.getElementById('current_music');
const voiceSelect = document.getElementById('voiceSelect');
const dateEl = document.getElementById('date');
const now = new Date();
dateEl.innerText = "session: "+now.toLocaleString(); // e.g., "9/20/2025, 10:55:00 AM"
let currentMusicStopFlag = null;


let voiceAudios = {}; // will hold all loaded audio elements

// Configuration
let TotalMins = 120; // total session
let workMins = 10;
let restMins = 5;

// State
let currentState = "idle"; // idle | work | rest | done
let phaseElapsed = 0;      // seconds in current phase
let totalElapsed = 0;      // seconds in whole session
let phaseDuration = 0;
let lastEvent = "";

const EventType = {
    VOICE: "voice",
    MUSIC: "music",
    BELL: "bell",
    CHEER: "cheer"
};

// ==== music stuff ====


// Helpers
function shuffle(array){ return array.sort(()=>Math.random()-0.5); }

function setMusicVolume(ids, volume){
    ids.forEach(id => {
        const audio = document.getElementById(id);
        if(audio) audio.volume = volume; // 0.0 to 1.0
		 if(volume === 0) {
                audio.pause();
                audio.currentTime = 0;
            }
    });
}

// Play randomized playlist with 2s pause, loops until stopFlag.stop = true
async function playPlaylist(ids, stopFlag){
    while(!stopFlag.stop){
        const list = shuffle(ids.slice());
        for(const id of list){
            if(stopFlag.stop) return;
            const audio = document.getElementById(id);
            if(!audio) continue;
            audio.currentTime = 0;
             console.log("Playing music:", id, "src:", audio.src); // << show which file
			 
			const fullPath = audio.src;
			const fileName = fullPath.split('/').pop(); // takes last part after '/'
			currentMusicPlaying.innerText = "Music: " + fileName;

            await audio.play();
            await new Promise(resolve => { audio.onended = resolve; });
            await new Promise(resolve => setTimeout(resolve,2000));
        }
    }
}

// ==== load voice audio ===

// Helpers
function formatTime(seconds){
    return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
}

async function loadVoiceAudios(selectedVoice) {
    voiceAudios = {};
    const loadPromises = [];

  // Define the voice audio types
    const voiceEvents = ['begin','resume','pause','end'];
    const cheers = ['active','resting'];

    [...voiceEvents, ...cheers].forEach(prefix => {
        voiceAudios[prefix] = [];
        for (let i = 1; i <= 4; i++) { // max 4 per type
            const path = `audio/${selectedVoice}/${prefix}00${i}.mp3`;
            const audio = new Audio(path);
            voiceAudios[prefix].push(audio);

            const p = new Promise(resolve => {
                audio.addEventListener('canplaythrough', resolve, { once: true });
                audio.addEventListener('error', () => {
                    console.warn("Failed to load:", path);
                    resolve(); // resolve anyway
                }, { once: true });
            });
            loadPromises.push(p);
        }
    });

    console.log("Loading all audio...");
    await Promise.all(loadPromises); // ✅ now allowed
    console.log("All voice audios loaded.");
}

// Track session events
let sessionEventList = [];
let firedEvents = new Set(); // keep track of fired events

// Build events for a single phase
function buildPhaseEvents(phase, isFirstPhase) {
    const events = [];
    const phaseSec = phase === "work" ? workMins*60 : restMins*60;

   // 1. Voice at phase start
let voiceDesc = "";
if(isFirstPhase && phase === "work") {
    voiceDesc = "begin voice";
} else if(phase === "work") {
    voiceDesc = "resume voice";
} else if(phase === "rest") {
    voiceDesc = "pause voice";
}

events.push({
    type: EventType.VOICE,
    time: 2, // after the bell
    phase,
    description: voiceDesc
});

    // 2. Music starts 1s before voice
    events.push({
        type: EventType.MUSIC,
        time: 1,
        phase,
        description: `${phase} music start`
    });

    // 3. Bells every 60s, plus optional cheer
	// bell at the beginning..
	 events.push({
            type: EventType.BELL,
            time: 0,
            phase,
            description: "minute bell"
        });
    for(let t = 60; t <= phaseSec; t += 60){
		if(t< (phaseSec-10))
		{
			events.push({
				type: EventType.BELL,
				time: t,
				phase,
				description: "minute bell"
			});
			events.push({
				type: EventType.CHEER,
				time: t+2,
				phase,
				description: phase==="work" ? "active cheer" : "resting cheer"
			});
		}else{
			console.log("skipped bell and cheer, too close to next phase start");
		}
    }

    return events;
}

// Build full session event list
function buildSessionEventList() {
    const allEvents = [];
    let totalTime = 0;
    let isFirstPhase = true;
    const phaseOrder = ["work", "rest"];
	let lastPhase = "work"; // keep track of the last phase

    while(totalTime < TotalMins*60){
        for(const phase of phaseOrder){
			lastPhase = phase;
            const phaseEvents = buildPhaseEvents(phase, isFirstPhase);
            // shift to absolute time
            phaseEvents.forEach(e => e.time += totalTime);
            allEvents.push(...phaseEvents);

            totalTime += phase === "work" ? workMins*60 : restMins*60;
            isFirstPhase = false;
            if(totalTime >= TotalMins*60) break;
        }
    }
	
 // Add end voice at the very end of the session
    allEvents.push({
        type: EventType.VOICE,
        time: TotalMins*60, // absolute end of session
        phase: lastPhase,   // last phase played
        description: "end voice"
    });

	

    // Sort by absolute time for clarity
    allEvents.sort((a,b) => a.time - b.time);
    return allEvents;
}

// === IN START BUTTON ===
startBtn.addEventListener('click', async () => {

	noSleep.enable();
    console.log("NoSleep enabled — screen will stay awake");
    workMins = parseInt(document.getElementById('workDuration').value,10);
    restMins = parseInt(document.getElementById('restDuration').value,10);
    TotalMins = parseInt(document.getElementById('totalDuration').value,10);

    const selectedVoice = voiceSelect.value;
    await loadVoiceAudios(selectedVoice);

    // Build session event list here
    sessionEventList = buildSessionEventList();
    firedEvents.clear();
    console.log("Session events:", sessionEventList);

    // Initialize state
    currentState = "work";
    phaseElapsed = 0;
    totalElapsed = 0;
    sessionStarted= Date.now();
    phaseStarted= Date.now();
    phaseDuration = workMins * 60;
    stateEl.innerText = "Active";

    // Initialize progress bars
    progressBar.style.width = '0%';
    totalProgressBar.style.width = '0%';

    // Start animation loop
    requestAnimationFrame(animate);
});

function fireEvent(event)
{
 // Play audio if event is a voice
 switch(event.type)
 {
	case EventType.VOICE:
    let prefix = "";
    switch(event.description){
        case "begin voice":
            prefix = "begin"; break;
        case "resume voice":
            prefix = "resume"; break;
        case "pause voice":
            prefix = "pause"; break;
        case "end voice":
            prefix = "end"; break;
        default:
            prefix = "begin"; // fallback
    }

    // pick a random audio from the prefix array
    const audios = voiceAudios[prefix];
    if(audios && audios.length)
	{
        const index = Math.floor(Math.random() * audios.length);
        audios[index].play();
    }
	break;
	
	case EventType.CHEER:

    // pick a random audio from the cheer array
	const cheerPrefix = (event.phase === "work") ? 'active' : 'resting';
const cheerAudios = voiceAudios[cheerPrefix];

if(cheerAudios && cheerAudios.length){
    const index = Math.floor(Math.random() * cheerAudios.length);
    const audioToPlay = cheerAudios[index];
    console.log("Playing cheer audio:", audioToPlay.src);  // <- this shows the full path
    audioToPlay.play();
} else {
    console.warn("No cheer audios found for prefix:", cheerPrefix);
}

    break;
        case EventType.MUSIC:
            let musicIds;
            let musicEnabled;
            if(event.phase === "work") {
                musicIds = workMusicIds;
                musicEnabled = document.getElementById('workMusic').checked;
            } else {
                musicIds = relaxMusicIds;
                musicEnabled = document.getElementById('relaxMusic').checked;
            }

            if(musicEnabled) {
                // stop previous music
                if(currentMusicStopFlag) currentMusicStopFlag.stop = true;

                // start new music
				setMusicVolume(musicIds, 0.5); // start at half volume
                currentMusicStopFlag = { stop: false };
                playPlaylist(musicIds, currentMusicStopFlag);
            }
            break;

	
	
 case EventType.BELL:
        // select the correct bell based on phase
        let bellId = event.phase === "work" ? "work-bell" : "relax-bell";
        const bellAudio = document.getElementById(bellId);
        if(bellAudio){
            bellAudio.currentTime = 0; // restart if already playing
            bellAudio.play();
        }
        break;	
	
	default:
	console.log("unknown event type: "+event.type)
 }
}


// Settings toggle
window.addEventListener('DOMContentLoaded', () => {
    const settingsDiv = document.getElementById('settings');
    const toggleIcon = document.getElementById('session-controls-minified');

    settingsDiv.style.display = 'none';
    toggleIcon.style.display = 'inline';

    toggleIcon.addEventListener('click', () => {
        if(settingsDiv.style.display === 'none'){
            settingsDiv.style.display = 'block';
            toggleIcon.textContent = '❌';
        } else {
            settingsDiv.style.display = 'none';
            toggleIcon.textContent = '⚙️';
        }
    });
});

// === INSIDE ANIMATE() ===
function animate(){
    const totalElapsed = Math.floor((Date.now() - sessionStarted) / 1000);
    const phaseElapsed = Math.floor((Date.now() - phaseStarted) / 1000);

    // Update timers
    const remainingPhase = Math.max(phaseDuration - phaseElapsed, 0);
    timerEl.innerText = "phase: "+formatTime(remainingPhase);
    progressBar.style.width = `${100 * (phaseDuration - remainingPhase) / phaseDuration}%`;

    const remainingTotal = Math.max(TotalMins * 60 - totalElapsed, 0);
    totaltimerEl.innerText = "session: "+formatTime(remainingTotal);
    totalProgressBar.style.width = `${100 * (TotalMins*60 - remainingTotal) / (TotalMins*60)}%`;

    // Fire events if due
    sessionEventList.forEach(event => {
        if(totalElapsed >= event.time && !firedEvents.has(event)){
            console.log(`EVENT: [${event.type}] ${event.description} @${event.time}s`);
            debugLastEventEl.innerText = `EVENT: [${event.type}] ${event.description}`;
            firedEvents.add(event);
			
			// now actually do it..
			fireEvent(event);
			
			
        }
    });

    // Detect beginning/resume/pause (optional)
    let currentEvent = null;
    if(totalElapsed === 0) currentEvent = "begin";
    else if(currentState === "work" && phaseElapsed === 0 && totalElapsed > 0) currentEvent = "resume";
    else if(currentState === "rest" && phaseElapsed === 0) currentEvent = "pause";

    if(currentEvent && currentEvent !== lastEvent){
        debugLastEventEl.innerText = `EVENT: ${currentEvent}`;
        console.log("EVENT:", currentEvent);
        lastEvent = currentEvent;
    }

    // Phase transition
    if(phaseElapsed >= phaseDuration){
        if(totalElapsed >= TotalMins*60){
            currentState = "done";
            stateEl.innerText = "Done";
            timerEl.innerText = "00:00";
            progressBar.style.width = "100%";
            totalProgressBar.style.width = "100%";
            debugLastEventEl.innerText = "EVENT: end";
            console.log("EVENT: end");
            return;
        }

        if(currentState === "work"){
            currentState = "rest";
            phaseDuration = restMins * 60;
            stateEl.innerText = "Resting";
        } else if(currentState === "rest"){
            currentState = "work";
            phaseDuration = workMins * 60;
            stateEl.innerText = "Active";
        }

        phaseStarted = Date.now();
    }

	let targetVolume = 0.5;

	if(remainingPhase <= 10){
		targetVolume = 0.5 * (remainingPhase / 10); // linear fade from 1 → 0.5
		// Apply fade to all music
		console.log("fading music: "+targetVolume);
		setMusicVolume(workMusicIds.concat(relaxMusicIds), targetVolume);
	}




    if(currentState !== "done") requestAnimationFrame(animate);
}
</script>



</body>
</html>
