<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Background Example</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #444;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            padding: 2rem 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
        }
        h1 { font-weight: 300; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>Zen Space</h1>
        <p>The background is generated from 3 seamless looping noisy canvases.</p>
		<p id="seed"></p>
		<p id="expose_generated_textures"></p>
    </div>

    <!-- Import the script -->
    <script src="zenback.js"></script>
    
    <script>
        // Usage Example:
        // Color: Sage Green {r:130, g:192, b:128}, Seed: 12345
		var seed=Math.floor(Math.random()*12345);
        createZenBack({r:180, g:164, b:132}, seed);
		document.getElementById("seed").innerHTML="seed: "+seed;
    </script>
</body>
</html>
