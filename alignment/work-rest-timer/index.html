<style>
:root {
  --background: #f2ede4;

  --accent-tertiary: #c2b280;

  --button-padding: 16px 32px;

}

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--background);
  color: var(--contrast);
  margin: 0;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 25px;
}

h1, h3 { margin: 0; text-align: center; font-weight: normal; }
h1 { margin-bottom: 15px; color: rgba(255,255,255,0.7); font-style: italic; }
h3 { margin-bottom: 25px; font-size: 1.1rem; opacity: 0.8; }
small { display: block; margin-bottom: 15px; text-align: center; color: #8a8a84; }

fieldset {
  border: 2px solid var(--accent-primary);
  border-radius: 20px;
  padding: 25px;
  width: 95%;
  max-width: 600px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  margin: 0;
  background: rgba(255,255,255,0.3);
  transition: border-color 2.8s ease; /* Add this line for a soft color fade */
}

fieldset > legend {
  font-weight: normal;
  padding: 0 15px;
  color: var(--accent-primary);
  font-size: 1.5em;
}

.settings-group {
  border: 1px solid var(--accent-secondary);
  border-radius: 15px;
  padding: 15px;
  width: 100%;
  box-sizing: border-box;
  gap: 10px;
  display: flex;
  flex-direction: column;
  background: transparent;
}

.settings-group legend { font-size: 1.2em; color: var(--accent-secondary); padding: 0 10px; }

#timer, #totaltimer, #state { text-align: center; }
#timer { font-size: 4em; font-weight: bold; color: var(--accent-primary); }
#totaltimer { font-size: 1.8em; color: var(--accent-secondary); }
#state { font-size: 1.8em; margin-bottom: 10px; font-style: italic; }

#progress-container, #total-progress-container {
  width: 100%; height: 12px; border-radius: 6px; overflow: hidden;
  background: #dcd7cf; margin: 10px 0;
}
#progress-bar { height: 100%; width: 0%; background: var(--accent-soft); transition: width 0.3s; }
#total-progress-bar { height: 100%; width: 0%; background: var(--accent-secondary); transition: width 0.3s; }

button {
  background: var(--accent-secondary); color: #fff; border: none; border-radius: 30px;
  padding: var(--button-padding); font-size: var(--button-font); cursor: pointer;
  box-shadow: 0 4px 10px rgba(135, 111, 78, 0.3); transition: all 0.3s ease;
  width: 100%; max-width: 350px; margin-top: 10px;
}
button:hover { background: var(--accent-soft); transform: scale(1.02); }

input, select {
  padding: 10px; border-radius: 8px; border: 1px solid var(--accent-soft);
  background: #fff; width: 100%; box-sizing: border-box; font-size: 1.1rem;
  margin: 5px 0; color: var(--contrast);
}

.control-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; }
.control-row label { flex: 1; font-size: 0.9rem; }
.control-row select { flex: 2; }

@media (max-width: 400px) {
  #timer { font-size: 3.2em; }
  button { font-size: 1.5rem; padding: 14px 28px; }
}
</style>

<script>
const startBtn = document.getElementById('startBtn');
const timerEl = document.getElementById('timer'); 
const progressBar = document.getElementById('progress-bar'); 
const totaltimerEl = document.getElementById('totaltimer'); 
const totalProgressBar = document.getElementById('total-progress-bar'); 
const stateEl = document.getElementById('state');
const mainFieldset = document.getElementById('mainFieldset');
 const optionsFieldset = document.getElementById('optionsFieldset');
const currentMusicPlaying = document.getElementById('current_music');
const voiceSelect = document.getElementById('voiceSelect');
const dateEl = document.getElementById('date');

dateEl.innerText = "session: " + new Date().toLocaleString(); 

let currentMusicStopFlag = null;
let voiceAudios = {}; 
let TotalMins = 120, workMins = 10, restMins = 5;
let currentState = "idle", phaseElapsed = 0, totalElapsed = 0, phaseDuration = 0;
let sessionStarted, phaseStarted;

const EventType = { VOICE: "voice", MUSIC: "music", BELL: "bell", CHEER: "cheer" };

function shuffle(array) { return array.sort(() => Math.random() - 0.5); }


async function fadeOutAndStop(audio, duration = 1500) {
    const startVolume = audio.volume;
    const steps = 20; // Number of volume increments
    const interval = duration / steps;

    for (let i = 0; i < steps; i++) {
        if (audio.paused) break;
        audio.volume = Math.max(0, startVolume - (startVolume * (i / steps)));
        await new Promise(resolve => setTimeout(resolve, interval));
    }
    audio.pause();
}
async function playPlaylist(phaseType, stopFlag) {
    const mixLabel = (phaseType === 'work') ? document.getElementById('workMusicSelect').value : document.getElementById('relaxMusicSelect').value;
    
    console.log(`--- 🎵 Music System Triggered ---`);
    console.log(`Phase: phaseType∣SelectedMixLabel:{phaseType} | Selected Mix Label:phaseType∣SelectedMixLabel:{mixLabel}`);

    if (mixLabel === 'none') {
        console.log("Music set to 'none'. Skipping playback.");
        currentMusicPlaying.innerText = "Music: None";
        return;
    }

    // --- NAMING CONVENTION LOGIC ---
    // If mixLabel is 'workout', we look for 'music-work'
    // If mixLabel is 'relax', we look for 'music-relax'
    let searchPrefix = "";
    if (mixLabel === 'workout') {
        searchPrefix = 'music-work';
    } else if (mixLabel === 'relax') {
        searchPrefix = 'music-relax';
    } else {
        searchPrefix = 'music-' + mixLabel; // Fallback
    }

    console.log(`Searching for keys starting with: "${searchPrefix}"`);

    // Filter the global bundle keys
    const poolIds = Object.keys(window.audioBundle).filter(id => id.startsWith(searchPrefix));

    console.log(`Found ${poolIds.length} matching tracks:`, poolIds);

    if (poolIds.length === 0) {
        console.error(`❌ No tracks found in audioBundle matching prefix "${searchPrefix}"`);
        currentMusicPlaying.innerText = "Music: No files found";
        return;
    }

    while (!stopFlag.stop) {
        console.log("Shuffling pool and starting loop...");
        const list = shuffle([...poolIds]);
        
        for (const id of list) {
            if (stopFlag.stop) {
                console.log("Stop flag detected. Exiting loop.");
                return;
            }

            const audio = document.getElementById(id);
            
            if (!audio) {
                console.error(`❌ Element with ID "${id}" not found in DOM, skipping...`);
                continue;
            }

            console.log(`▶️ Playing track: ${id}`);
            audio.currentTime = 0;
            audio.volume = 1; 
            currentMusicPlaying.innerText = "Music Mix [" + mixLabel + "]: " + id;

            try {
                await audio.play();
                console.log(`✅ Playback started for ${id}`);
            } catch (err) {
                console.error(`❌ Playback failed for ${id}:`, err);
                continue; 
            }

            // Wait for song to end or stop flag
            await new Promise(async resolve => {
                audio.onended = () => {
                    console.log(`Song ended: ${id}`);
                    resolve();
                };
                
                const checkStop = setInterval(async () => {
                    if (stopFlag.stop) {
                        clearInterval(checkStop);
                        console.log(`Stopping ${id} via fadeout...`);
                        await fadeOutAndStop(audio, 1000);
                        resolve();
                    }
                }, 100);
            });
        }
    }
}



function formatTime(seconds){
    return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;
}
async function loadVoiceAudios(selectedVoice) {
    voiceAudios = {};
    if (selectedVoice === 'none') return;

    var voiceEvents = ['begin', 'resume', 'pause', 'end', 'active', 'resting'];
    
    for (var i = 0; i < voiceEvents.length; i++) {
        var eventName = voiceEvents[i];
        voiceAudios[eventName] = [];
        
        // Construct search prefix: e.g., "voice-Alice-begin"
        var searchPrefix = "voice-" + selectedVoice + "-" + eventName;
        
        // Find all keys in the bundle that match this prefix
        var matches = Object.keys(window.audioBundle).filter(function(id) { 
            return id.indexOf(searchPrefix) === 0; 
        });
        
        console.log("Voice Loading: Found " + matches.length + " clips for " + searchPrefix);
        voiceAudios[eventName] = matches;
    }
}


function buildPhaseEvents(phase, isFirstPhase) {
    const events = [];
    const phaseSec = phase === "work" ? workMins * 60 : restMins * 60;
    let voiceDesc = (isFirstPhase && phase === "work") ? "begin" : (phase === "work" ? "resume" : "pause");
    
    events.push({ type: EventType.VOICE, time: 2, phase, description: voiceDesc });
    events.push({ type: EventType.MUSIC, time: 1, phase, description: "start" });
    events.push({ type: EventType.BELL, time: 0, phase, description: "bell" });

    for (let t = 60; t <= phaseSec; t += 60) {
        if (t < (phaseSec - 10)) {
            events.push({ type: EventType.BELL, time: t, phase, description: "bell" });
            events.push({ type: EventType.CHEER, time: t + 2, phase, description: phase === "work" ? "active" : "resting" });
        }
    }
    return events;
}

function buildSessionEventList() {
    const allEvents = [];
    let totalTime = 0;
    let isFirstPhase = true;
    let lastPhase = "work";

    while (totalTime < TotalMins * 60) {
        for (const phase of ["work", "rest"]) {
            lastPhase = phase;
            const phaseEvents = buildPhaseEvents(phase, isFirstPhase);
            phaseEvents.forEach(e => e.time += totalTime);
            allEvents.push(...phaseEvents);
            totalTime += phase === "work" ? workMins * 60 : restMins * 60;
            isFirstPhase = false;
            if (totalTime >= TotalMins * 60) break;
        }
    }
    allEvents.push({ type: EventType.VOICE, time: TotalMins * 60, phase: lastPhase, description: "end" });
    return allEvents.sort((a, b) => a.time - b.time);
}

startBtn.addEventListener('click', async () => {
    noSleep.enable();
	startBtn.style.display="none";
	optionsFieldset.style.display="none";
    workMins = parseInt(document.getElementById('workDuration').value, 10);
    restMins = parseInt(document.getElementById('restDuration').value, 10);
    TotalMins = parseInt(document.getElementById('totalDuration').value, 10);
    
    await loadVoiceAudios(voiceSelect.value);
    
    sessionEventList = buildSessionEventList();
    firedEvents.clear();
    currentState = "work";
    phaseElapsed = 0;
    totalElapsed = 0;
    sessionStarted = Date.now();
    phaseStarted = Date.now();
    phaseDuration = workMins * 60;
    stateEl.innerText = "Active";
	 mainFieldset.style.borderColor = "#b7cda4";
	 optionsFieldset.style.borderColor = "#b7cda4";
    progressBar.style.width = '0%';
    totalProgressBar.style.width = '0%';
    requestAnimationFrame(animate);
});

let firedEvents = new Set();
function fireEvent(event) {
    var phase = event.phase;
    
    switch (event.type) {
        case EventType.VOICE:
            if (voiceSelect.value === 'none') return;
            var vIds = voiceAudios[event.description];
            if (vIds && vIds.length > 0) {
                var randomId = vIds[Math.floor(Math.random() * vIds.length)];
                var audio = document.getElementById(randomId);
                if (audio) {
                    console.log("🗣️ Playing Voice: " + randomId);
                    audio.currentTime = 0;
                    audio.play();
                }
            }
            break;

        case EventType.CHEER:
            if (voiceSelect.value === 'none') return;
            var cPrefix = (phase === "work") ? 'active' : 'resting';
            var cIds = voiceAudios[cPrefix];
            if (cIds && cIds.length > 0) {
                var randomId = cIds[Math.floor(Math.random() * cIds.length)];
                var audio = document.getElementById(randomId);
                if (audio) {
                    console.log("🗣️ Playing Cheer: " + randomId);
                    audio.currentTime = 0;
                    audio.play();
                }
            }
            break;

        case EventType.MUSIC:
            if (currentMusicStopFlag) currentMusicStopFlag.stop = true;
            currentMusicStopFlag = { stop: false };
            playPlaylist(phase === "work" ? 'work' : 'relax', currentMusicStopFlag);
            break;

         case EventType.BELL:
            var sfxLabel = (phase === "work") ? document.getElementById('workBellSelect').value : document.getElementById('relaxBellSelect').value;
            if (sfxLabel === 'none') return;
            
            // Ensure the sfx- prefix is present for the ID
            var bellId = sfxLabel.indexOf('sfx-') === 0 ? sfxLabel : 'sfx-' + sfxLabel;
            var bellAudio = document.getElementById(bellId);

            if (bellAudio) { 
                bellAudio.currentTime = 0; 
                bellAudio.play();
            } else {
                console.error("🚫 No audio element found with id: " + bellId);
            }
            break;
    }
}


window.addEventListener('DOMContentLoaded', () => {
    const settingsDiv = document.getElementById('settings');
    const toggleIcon = document.getElementById('session-controls-minified');
   
    optionsFieldset.addEventListener('click', () => {
        const isHidden = settingsDiv.style.display === 'none';
        settingsDiv.style.display = isHidden ? 'block' : 'none';
        toggleIcon.textContent = isHidden ? '⮝' : '⮟';
        
        settingsDiv.addEventListener('click', (event) => {
            event.stopPropagation(); 
        });
    });

    // --- ADD THIS PART FOR THE BELL PREVIEWS ---
    const workBellSelect = document.getElementById('workBellSelect');
    const relaxBellSelect = document.getElementById('relaxBellSelect');

    const playPreview = (selectElement, phase) => {
        const sfxLabel = selectElement.value;
        if (sfxLabel === 'none') return;
        
        const allSfx = Array.from(document.querySelectorAll('.sfx'));
        const bellAudio = allSfx.find(a => a.getAttribute('label') === sfxLabel);
        if (bellAudio) {
            bellAudio.currentTime = 0;
            bellAudio.play();
        }
    };

    workBellSelect.addEventListener('change', () => playPreview(workBellSelect, 'work'));
    relaxBellSelect.addEventListener('change', () => playPreview(relaxBellSelect, 'rest'));
});


function animate() {
    const tElapsed = Math.floor((Date.now() - sessionStarted) / 1000);
    const pElapsed = Math.floor((Date.now() - phaseStarted) / 1000);
    const remainingPhase = Math.max(phaseDuration - pElapsed, 0);
    
    timerEl.innerText = "phase: " + formatTime(remainingPhase);
    progressBar.style.width = `${100 * (phaseDuration - remainingPhase) / phaseDuration}%`;
    const remainingTotal = Math.max(TotalMins * 60 - tElapsed, 0);
    totaltimerEl.innerText = "session: " + formatTime(remainingTotal);
    totalProgressBar.style.width = `${100 * (TotalMins * 60 - remainingTotal) / (TotalMins * 60)}%`;

    sessionEventList.forEach(event => {
        if (tElapsed >= event.time && !firedEvents.has(event)) {
            firedEvents.add(event);
            fireEvent(event);
        }
    });

   if (pElapsed >= phaseDuration) {
    if (tElapsed >= TotalMins * 60) {
        currentState = "done";
        stateEl.innerText = "Done";
        mainFieldset.style.borderColor = 'var(--accent-primary)'; // Reset to original color
		optionsFieldset.style.borderColor = 'var(--accent-primary)'; // Reset to original color
        return;
    }
    currentState = (currentState === "work") ? "rest" : "work";
    phaseDuration = (currentState === "work") ? workMins * 60 : restMins * 60;
    
    // Update Text
    stateEl.innerText = (currentState === "work") ? "Active" : "Resting";
    
    // Update Border Color
    mainFieldset.style.borderColor = (currentState === "work") ? "#b7cda4" : "#c48e81";
    
    phaseStarted = Date.now();
}


    if (currentState !== "done") requestAnimationFrame(animate);
}



</script>
